<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 110" preserveAspectRatio="xMidYMid slice" role="img" aria-label="a waveform wobbling over a pumping bass speaker"><style>.wb{animation:wb 1.2s ease-in-out infinite alternate}@keyframes wb{from{d:path("M0 55 C30 20 50 90 80 55 S130 20 160 55 S210 90 240 55")}to{d:path("M0 55 C30 75 50 35 80 55 S130 85 160 55 S210 25 240 55")}}.cone{transform-box:fill-box;transform-origin:center;animation:cone .3s ease-in-out infinite alternate}@keyframes cone{to{transform:scale(1.14)}}.w2{animation-duration:.6s;opacity:.5}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d0414"/><stop offset="1" stop-color="#3a0d3a"/></linearGradient><radialGradient id="g"><stop offset="0" stop-color="#ff6fa8" stop-opacity=".45"/><stop offset="1" stop-color="#ff6fa8" stop-opacity="0"/></radialGradient></defs><rect width="240" height="110" fill="url(#s)"/><circle cx="120" cy="58" r="50" fill="url(#g)"/><circle class="cone" cx="120" cy="58" r="30" fill="#14060f" stroke="#ff6fa8" stroke-width="1.5"/><circle class="cone" cx="120" cy="58" r="16" fill="#1f0a18" stroke="#ff6fa8"/><circle cx="120" cy="58" r="5" fill="#ff6fa8"/><path class="wb" d="M0 55 C30 20 50 90 80 55 S130 20 160 55 S210 90 240 55" fill="none" stroke="#ffe0ef" stroke-width="2.2"/><path class="wb w2" d="M0 55 C30 20 50 90 80 55 S130 20 160 55 S210 90 240 55" fill="none" stroke="#ff6fa8" stroke-width="4"/></svg>