<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 110" preserveAspectRatio="xMidYMid slice" role="img" aria-label="speaker stacks in the dark throwing shockwaves on every drop"><style>.ring{transform-origin:120px 66px;animation:ring 2.4s cubic-bezier(.2,.6,.3,1) infinite}@keyframes ring{from{transform:scale(.4);opacity:1}to{transform:scale(6);opacity:0}}.cone{transform-box:fill-box;transform-origin:center;animation:cone .3s ease-out infinite alternate}@keyframes cone{to{transform:scale(1.12)}}.sh{animation:sh 2.4s ease-out infinite}@keyframes sh{0%{opacity:.9}30%,100%{opacity:.15}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0206"/><stop offset="1" stop-color="#2a0510"/></linearGradient></defs><rect width="240" height="110" fill="url(#s)"/><rect class="sh" width="240" height="110" fill="#ff2266" opacity=".15"/><circle class="ring" style="animation-delay:0.0s" cx="120" cy="66" r="10" fill="none" stroke="#ff2266" stroke-width="2"/><circle class="ring" style="animation-delay:0.6s" cx="120" cy="66" r="10" fill="none" stroke="#ff2266" stroke-width="2"/><circle class="ring" style="animation-delay:1.2s" cx="120" cy="66" r="10" fill="none" stroke="#ff2266" stroke-width="2"/><circle class="ring" style="animation-delay:1.8s" cx="120" cy="66" r="10" fill="none" stroke="#ff2266" stroke-width="2"/><g><rect x="18" y="40" width="34" height="62" rx="2" fill="#0a0508" stroke="#3a1020"/><circle class="cone" cx="35" cy="58" r="10" fill="#140a10" stroke="#ff2266" stroke-width="1"/><circle class="cone" cx="35" cy="85" r="12" fill="#140a10" stroke="#ff2266" stroke-width="1"/></g><g><rect x="56" y="40" width="34" height="62" rx="2" fill="#0a0508" stroke="#3a1020"/><circle class="cone" cx="73" cy="58" r="10" fill="#140a10" stroke="#ff2266" stroke-width="1"/><circle class="cone" cx="73" cy="85" r="12" fill="#140a10" stroke="#ff2266" stroke-width="1"/></g><g><rect x="150" y="40" width="34" height="62" rx="2" fill="#0a0508" stroke="#3a1020"/><circle class="cone" cx="167" cy="58" r="10" fill="#140a10" stroke="#ff2266" stroke-width="1"/><circle class="cone" cx="167" cy="85" r="12" fill="#140a10" stroke="#ff2266" stroke-width="1"/></g><g><rect x="188" y="40" width="34" height="62" rx="2" fill="#0a0508" stroke="#3a1020"/><circle class="cone" cx="205" cy="58" r="10" fill="#140a10" stroke="#ff2266" stroke-width="1"/><circle class="cone" cx="205" cy="85" r="12" fill="#140a10" stroke="#ff2266" stroke-width="1"/></g><rect x="0" y="102" width="240" height="8" fill="#050103"/></svg>