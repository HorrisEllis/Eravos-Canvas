# Every pull request: the checks that keep ERAVOS what he asked for — sound proved, no toys, no Playwright, and the design guide
# (docs/DESIGN-GUIDE.md) measured on every tool.
name: checks
on:
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Components, null-render maths
        run: node tests/components.mjs
      - name: Every manifest valid (tool.json, domain, suite, pack schemas)
        run: node build/validate.mjs
      - name: The canvas is the host only (specs/eravos.bare-canvas.spec)
        run: node tests/bare-canvas.test.mjs
      - name: Component contracts true to their code (ports, variables, UI element)
        run: node build/component-contract.mjs
      - name: Every tool announces its needs from its DAG
        run: node build/tool-needs.mjs --check
      - name: No toys
        run: node tests/no-toys.mjs
      - name: No Playwright
        run: node tests/no-playwright.mjs
      - name: The app ships every file its main process needs (the Setup starts)
        run: node desktop/test/shipped-files.mjs
      - name: The tools in the library
        run: node desktop/test/library-tools.mjs
      - name: Competence register (append-only, every quote word for word)
        run: |
          git fetch --depth=1 origin ${{ github.base_ref || 'main' }}
          node build/competence.mjs --check --base FETCH_HEAD
      - name: Songs decomposed hold together, and are up to date with the songbooks
        env:
          GLASS_CHROMIUM: /usr/bin/google-chrome
        run: |
          node tests/song-parts.test.mjs
          node build/song-decompose.mjs
          git diff --exit-code -- tools/music/data/song-parts docs/song-decomposition.md
      - name: Design check (every tool, against docs/DESIGN-GUIDE.md)
        env:
          GLASS_CHROMIUM: /usr/bin/google-chrome
        run: node tests/design-check.mjs
      - name: Novelty gate's own test (verdicts, roles, never blocks)
        run: node tests/novelty-gate.test.mjs
      - name: Novelty gate (advisory — it names close sounds, it never blocks; his call 2026-11-07)
        continue-on-error: true
        env:
          GLASS_CHROMIUM: /usr/bin/google-chrome
        run: |
          git fetch --depth=1 origin ${{ github.base_ref || 'main' }}
          node build/novelty-gate.mjs --base FETCH_HEAD
