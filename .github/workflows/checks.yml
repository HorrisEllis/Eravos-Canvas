# Every pull request: the checks that keep ERAVOS what he asked for — sound proved, no toys, no Playwright, and the design guide
# (docs/DESIGN-GUIDE.md) measured on every tool.
name: checks
on:
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Components, null-render maths
        run: node tests/components.mjs
      - name: No toys
        run: node tests/no-toys.mjs
      - name: No Playwright
        run: node tests/no-playwright.mjs
      - name: Competence register (append-only, every quote word for word)
        run: |
          git fetch --depth=1 origin ${{ github.base_ref || 'main' }}
          node build/competence.mjs --check --base FETCH_HEAD
      - name: Design check (every tool, against docs/DESIGN-GUIDE.md)
        env:
          GLASS_CHROMIUM: /usr/bin/google-chrome
        run: node tests/design-check.mjs
