# 3.99 the release the update service looks for. Push a tag vX.Y.Z (with desktop/package.json "version" set to X.Y.Z):
# this builds ERAVOS for Windows and attaches the installer dist/ERAVOS-Setup-X.Y.Z.exe and the portable dist/ERAVOS_X.Y.Z.zip to the
# GitHub release of that tag. The app (desktop/updater.js) and Install ERAVOS.bat download the Setup (the zip for a portable copy).
name: release
# 3.148 and every merge to main (his: "Can you integrate git into Eravos?"): the same build and tests, published as a pre-release
# v<next patch>-beta.<run> — ERAVOS on the Beta channel (Settings › About & updates) offers it; Stable never sees it (not "latest")
on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:   # by hand: a build to download; with "release" on, it also makes the release v<desktop/package.json version>
    inputs:
      release:
        description: 'Publish the release v<version> (makes the tag) instead of only keeping the build'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:   # betas: a newer merge replaces a build still running; releases are never cancelled
  group: release-${{ github.event_name }}-${{ github.ref }}   # its own group per kind: a merge never cancels a release run by hand
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: The app's version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: A beta (a merge to main) — the next patch, -beta.<run>, written into the app before it is built
        id: beta
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $p = Get-Content desktop/package.json -Raw | ConvertFrom-Json
          $n = ($p.version -split '-')[0].Split('.'); $n[2] = [string]([int]$n[2] + 1)
          $b = ($n -join '.') + '-beta.${{ github.run_number }}'
          (Get-Content desktop/package.json -Raw) -replace '"version":\s*"[^"]*"', ('"version": "' + $b + '"') | Set-Content desktop/package.json -NoNewline
          "version=$b" >> $env:GITHUB_OUTPUT
          Write-Host "beta $b"
      - name: Check the tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if ("v${{ steps.ver.outputs.version }}" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} but desktop/package.json says ${{ steps.ver.outputs.version }}" }
      - name: Component and null-render maths (plain node, no browser)
        shell: pwsh
        run: |
          node tests/components.mjs
          node tests/no-toys.mjs
          node tests/no-playwright.mjs
      - name: Test the update service (no Electron, no network)
        run: node desktop/test/updater.mjs
      - name: NSIS (makes ERAVOS-Setup.exe)
        shell: pwsh
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }
      - name: Build ERAVOS.exe + ERAVOS-Setup.exe
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging/windows/make-exe.ps1 -NoStart
          if (-not (Get-ChildItem dist -Filter 'ERAVOS-Setup-*.exe')) { throw 'no ERAVOS-Setup exe was made' }
      - name: Test ERAVOS Update on the built app (it must put an update in place and keep your folders)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/windows/test-update.ps1
      - name: Test ERAVOS Update.exe end to end (Restart now → the exe → the real Setup → installed)
        run: node packaging/windows/test-update-exe.mjs
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ERAVOS ${{ steps.ver.outputs.version }}
          files: |
            dist/ERAVOS-Setup-*.exe
            dist/ERAVOS_*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
      - name: Publish the beta (pre-release; never "latest")
        if: steps.beta.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.beta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ERAVOS ${{ steps.beta.outputs.version }} (beta — main ${{ github.sha }})
          prerelease: true
          make_latest: false
          files: |
            dist/ERAVOS-Setup-*.exe
            dist/ERAVOS_*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
      - name: Keep the build (a run by hand)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.release }}
        uses: actions/upload-artifact@v4
        with:
          name: ERAVOS-windows
          path: |
            dist/ERAVOS-Setup-*.exe
            dist/ERAVOS_*.zip
